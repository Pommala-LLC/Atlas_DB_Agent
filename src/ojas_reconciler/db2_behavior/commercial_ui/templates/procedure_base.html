<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/procedure_analysis.css">
</head>
<body class="procedure-app-body">
  <header class="procedure-app-topbar">
    <a class="procedure-app-brand" href="/runs"><span class="procedure-app-logo">△</span><strong>ATLAS</strong></a>
    <nav class="procedure-app-nav">
      <a href="/runs" class="active">Routines</a>
      <a href="/runs">Source View</a>
      <a href="/graph">Control Flow</a>
      <a href="/checks">Metrics</a>
      <a href="/artifacts">Reports</a>
    </nav>
    <div class="procedure-app-actions"><span>?</span><span>⚙</span><span class="procedure-app-avatar">A</span></div>
  </header>
  <main class="procedure-app-main">
    {% if message %}<div class="notice success">{{ message }}</div>{% endif %}
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
